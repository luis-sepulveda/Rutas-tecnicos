<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividades — módulo por mes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MODULO POR MES
   Se entra por la portada de meses, se elige uno y ahi aparece
   el detalle: dias, estados y el desglose por tipo de actividad.
   Lee los mismos archivos que el dashboard: datos.json al lado
   e historico_dias.json del repo de rutas.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f8; --panel:#fff; --panel2:#eef2f6; --zebra:#f8fafc;
  --linea:#dbe3ec; --linea2:#b9c6d4;
  --ink:#16232f; --tenue:#5f7386; --debil:#93a3b4;
  --ok:#0f766e; --mal:#e05252; --ojo:#b45309; --frio:#4f46e5; --gris:#64748b;
  /* el coral de las barras es claro, asi que los numeros y las etiquetas
     usan una version mas oscura para que se lean bien sobre blanco */
  --mal-texto:#c0392f;
  --amarillo:#facc15; --amarillo2:#a16207;
  --relieve:0 1px 2px rgba(20,45,70,.06);
}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;
     padding:22px 20px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sub{font-size:13px;color:var(--tenue);margin-top:2px}
.cab{margin-bottom:20px}

.btn{background:var(--panel);border:1px solid var(--linea);color:var(--ink);
     padding:7px 15px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--linea2)}
.chip{background:var(--panel2);border:1px solid var(--linea);color:var(--tenue);
      padding:5px 13px;border-radius:999px;font:inherit;font-size:12.5px;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--linea2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}

/* ---- portada de meses ---- */
.meses{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.mes{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:22px 24px;
     cursor:pointer;box-shadow:var(--relieve);transition:.15s}
.mes:hover{border-color:var(--linea2);transform:translateY(-2px)}
.mes .nom{font-size:20px;font-weight:700;text-transform:capitalize}
.mes .curso{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;
            background:#fef3c7;color:#92400e;margin-left:8px;vertical-align:2px}
.mes .grande{font-size:44px;font-weight:700;line-height:1.05;margin:12px 0 2px}
.mes .bajo{font-size:13px;color:var(--tenue)}
.mes .mini{display:flex;gap:20px;margin-top:16px;padding-top:14px;border-top:1px solid var(--linea)}
.mes .mini div .n{font-size:17px;font-weight:700}
.mes .mini div .l{font-size:11.5px;color:var(--tenue)}
.mes .ir{font-size:12.5px;color:var(--frio);margin-top:14px}

/* enlaces a las otras vistas del mismo repo */
.otras{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px;padding-top:18px;
       border-top:1px solid var(--linea)}
.otras a,.otras button{background:var(--panel);border:1px solid var(--linea);
         border-radius:999px;padding:8px 16px;font-size:13px;color:var(--ink);
         text-decoration:none;font-family:inherit;cursor:pointer}
.otras a:hover,.otras button:hover{border-color:var(--linea2)}
.otras .et{font-size:12px;color:var(--debil);align-self:center;margin-right:4px}

/* ---- detalle del mes ---- */
.fila-f{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.fila-f .et{font-size:11px;color:var(--debil);text-transform:uppercase;letter-spacing:.8px;
            margin-right:4px}
.estados{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.est{background:var(--panel);border:1px solid var(--linea);border-left:4px solid var(--linea);
     border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:var(--relieve);transition:.15s}
.est:hover{border-color:var(--linea2)}
.est.on{border-color:var(--ink);border-left-color:var(--ink);box-shadow:0 0 0 2px rgba(22,35,47,.08)}
.est .n{font-size:30px;font-weight:700;line-height:1}
.est .l{font-size:12.5px;color:var(--tenue);margin-top:3px}
.est .p{font-size:12px;color:var(--debil);margin-top:1px}
.est.comp{border-left-color:var(--ok)} .est.comp .n{color:var(--ok)}
.est .p b{color:var(--ink);font-weight:700}
.est .ef{font-size:13px;color:var(--tenue);margin-top:6px;padding-top:6px;border-top:1px solid var(--linea)}
.est .ef b{color:var(--ok);font-size:15px}
.est.nore{border-left-color:var(--mal)} .est.nore .n{color:var(--mal-texto)}
.est.canc{border-left-color:var(--ojo)} .est.canc .n{color:var(--ojo)}
.est.susp{border-left-color:var(--gris)} .est.susp .n{color:var(--gris)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){ .grid2{grid-template-columns:1fr} }
.caja{background:var(--panel);border:1px solid var(--linea);border-radius:12px;
      padding:15px 18px;box-shadow:var(--relieve);margin-bottom:14px}
.caja h2{font-size:13.5px;font-weight:700;margin-bottom:12px}
.caja h2 .chico{font-weight:400;color:var(--tenue);font-size:12px;margin-left:6px}

.lin{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px solid var(--linea)}
.lin:last-child{border-bottom:0}
.lin .nm{width:180px;font-size:13px;flex-shrink:0}
.lin .pista{flex:1;height:15px;background:var(--panel2);border-radius:4px}
.lin .pista span{display:block;height:100%;border-radius:4px;background:var(--frio)}
.lin .vl{width:52px;text-align:right;font-size:13px;font-weight:700}
.lin .pc{width:48px;text-align:right;font-size:12px;color:var(--debil)}
.vacio{font-size:13px;color:var(--debil);padding:10px 0}
.lin.abrir{cursor:pointer}
.lin.abrir:hover .nm{color:var(--ink)}
.lin.abrir .nm::after{content:' ▾';font-size:10px}
.lin.abrir.abierta .nm::after{content:' ▴'}
.lin.hija{padding-left:16px;border-bottom:1px dashed var(--linea)}
.lin.hija .nm{width:164px;font-size:12.5px;color:var(--tenue)}

.rutas{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.rutas .r{background:var(--panel2);border-radius:9px;padding:9px 11px}
.rutas .r .n{font-size:20px;font-weight:700;line-height:1.1}
.rutas .r .l{font-size:11px;color:var(--tenue);margin-top:2px}
.rutas .r.caida .n{color:var(--mal-texto)}

/* De quien fue la caida */
.culpa{display:flex;height:30px;border-radius:7px;overflow:hidden;margin-bottom:14px}
.culpa span{display:flex;align-items:center;justify-content:center;font-size:12px;
            font-weight:700;color:#fff}
.cul-cli{background:#94a3b8} .cul-man{background:#7c3aed} .cul-nos{background:var(--mal)}
.cul-lista .f{display:flex;align-items:center;gap:11px;padding:9px 0;
              border-bottom:1px solid var(--linea)}
.cul-lista .f:last-child{border-bottom:0}
.cul-lista .pt{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.cul-lista .tx{flex:1;font-size:13px}
.cul-lista .tx small{display:block;color:var(--debil);font-size:11.5px;margin-top:1px}
.cul-lista .vv{font-size:17px;font-weight:700}
.cul-lista .pp{width:52px;text-align:right;font-size:12.5px;color:var(--tenue)}

/* Fila de cifras grandes (la usa el reporte de direcciones repetidas). */
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px}
.cifra{background:var(--panel2);border-radius:10px;padding:11px 13px}
.cifra .n{font-size:25px;font-weight:700;line-height:1.1}
.cifra .l{font-size:11.5px;color:var(--tenue);margin-top:2px}

/* Reporte de direcciones repetidas */
.rep-fila{display:flex;align-items:center;gap:11px;padding:8px 7px;cursor:pointer;
          border-bottom:1px solid var(--linea)}
.rep-fila:hover{background:var(--hover)}
.rep-fila .veces{width:30px;text-align:center;font-weight:700;font-size:14px;flex-shrink:0;
                 border-radius:6px;padding:2px 0;background:var(--panel2)}
.rep-fila.alta .veces{background:var(--mal);color:#fff}
.rep-fila.media .veces{background:var(--amarillo);color:#6b4c07}
.rep-fila .dirn{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-fila .ultv{width:92px;text-align:right;font-size:11.5px;color:var(--debil);flex-shrink:0}
.rep-fila .fle{width:14px;font-size:10px;color:var(--debil);flex-shrink:0}
.rep-det{padding:2px 0 12px 48px}
.rep-det table{width:100%;border-collapse:collapse;font-size:12px}
.rep-det td{padding:5px 8px;border-bottom:1px dashed var(--linea)}
.rep-det .ot{font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:nowrap}
.rep-det .malo{color:var(--mal);font-weight:600}
.rep-det .der{color:var(--debil);font-size:11px}
.rutas .r.abre{cursor:pointer;transition:.12s}
.rutas .r.abre:hover{background:var(--linea)}
.rutas .r.abre.on{background:var(--ink)}
.rutas .r.abre.on .n,.rutas .r.abre.on .l{color:#fff}
.rutas .r .ver{font-size:10px;color:var(--debil);margin-top:3px}
.rutas .r.abre.on .ver{color:rgba(255,255,255,.7)}
.tdet{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:14px}
.tdet th{text-align:left;font-size:10px;letter-spacing:.7px;text-transform:uppercase;
         color:var(--debil);font-weight:700;padding:6px 9px;border-bottom:1px solid var(--linea)}
.tdet td{padding:7px 9px;border-bottom:1px solid var(--linea);vertical-align:top}
.tdet tr:nth-child(even) td{background:var(--zebra)}
.tdet .ot{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;white-space:nowrap}
.tdet .dir{color:var(--tenue);font-size:12px}

/* ============================================================
   QUIEBRES POR TECNICO (30-09-2026)
   Vista semanal que se abre con el boton "Quiebres por técnico"
   de la portada. Para revertir: borrar este bloque, el bloque JS
   QUIEBRES y el boton btn-qb de portada().
   ============================================================ */
.cul-sus{background:var(--gris)}
.qb-est .est{cursor:default}
.chip.qb-mes{text-transform:capitalize}
.qb-tipos{margin-bottom:12px}
.qb-tipos .qb-cuenta{font-size:12.5px;color:var(--tenue);margin-left:8px}
.qb-tipos .qb-cuenta b{color:var(--ink)}
.qb-caja{overflow-x:auto}
.qb-tabla{width:100%;min-width:760px;border-collapse:collapse;font-size:13px}
.qb-tabla th{text-align:right;font-size:10px;letter-spacing:.6px;text-transform:uppercase;
             color:var(--debil);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--linea);
             white-space:nowrap}
.qb-tabla th:first-child,.qb-tabla th.iz{text-align:left}
.qb-tabla td{padding:8px 8px;border-bottom:1px solid var(--linea);text-align:right;white-space:nowrap}
.qb-tabla td.iz{text-align:left}
.qb-tabla tr.tec{cursor:pointer}
.qb-tabla tr.tec:hover td{background:var(--zebra)}
.qb-tabla tr.tec.abierta td{background:var(--panel2)}
.qb-tabla td.nom{font-weight:600}
.qb-tabla td.nom small{display:block;font-weight:400;color:var(--debil);font-size:11px}
.qb-tabla td.q{font-weight:700;color:var(--mal-texto)}
.qb-tabla td.pq b{font-weight:700}
.qb-tabla td.pq.alto b{color:var(--mal-texto)}
.qb-mini{display:flex;height:12px;width:120px;border-radius:3px;overflow:hidden;background:var(--panel2)}
.qb-mini span{display:block;height:100%}
.qb-tabla td.cli{color:#475569} .qb-tabla td.man{color:#6d28d9} .qb-tabla td.nos{color:var(--mal-texto);font-weight:700}
.qb-tabla td.cero{color:var(--debil);font-weight:400}
.qb-det td{background:#fbfcfd;padding:12px 14px 16px;text-align:left;white-space:normal}
.qb-hist{font-size:12.5px;color:var(--tenue);margin-bottom:10px}
.qb-hist b{color:var(--ink)}
.qb-mot{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:6px}
.qb-mot .g{background:var(--panel);border:1px solid var(--linea);border-left:4px solid var(--linea);
           border-radius:9px;padding:9px 12px;font-size:12.5px}
.qb-mot .g.cli{border-left-color:#94a3b8} .qb-mot .g.man{border-left-color:#7c3aed}
.qb-mot .g.nos{border-left-color:var(--mal)} .qb-mot .g.sus{border-left-color:var(--gris)}
.qb-mot .g .t{font-weight:700;margin-bottom:4px}
.qb-mot .g div.m{display:flex;justify-content:space-between;color:var(--tenue);padding:1px 0}
.qb-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 2px}
.qb-acc .ok{font-size:12px;color:var(--ok)}
.qb-tabla .tdet td{white-space:normal;text-align:left}
.qb-tabla .tdet th{text-align:left}
.qb-tabla .tdet .desp{color:var(--ok);font-size:11.5px}
.qb-nota{font-size:12px;color:var(--tenue);line-height:1.5}
.qb-nota b{color:var(--ink)}

/* ============================================================
   QUIEBRES: MENOS NEGRO (30-09-2026, Luis: "mucho negro")
   Los botones elegidos de la vista de quiebres (mes, semana,
   supervisor, ordenar por y Todo/Altas/Migraciones) iban rellenos
   en negro. Ahora van en azul claro con letra azul: se nota cual
   esta elegido sin manchar la pantalla. Solo la vista de quiebres;
   el resto del dashboard queda igual. Para volver al negro: borrar
   este bloque.
   ============================================================ */
.chip.on[data-mq],.chip.on[data-sq],.chip.on[data-su],
.chip.on[data-oq],.chip.on[data-tp]{
  background:#e0ecff;border-color:#9dbcf2;color:#1d4ed8;font-weight:700}
.chip[data-mq]:not(.on):hover,.chip[data-sq]:not(.on):hover,.chip[data-su]:not(.on):hover,
.chip[data-oq]:not(.on):hover,.chip[data-tp]:not(.on):hover{border-color:#9dbcf2;color:#1d4ed8}
/* la fila del tecnico abierto, en el mismo azul muy suave */
.qb-tabla tr.tec.abierta td{background:#f0f6ff}

/* ============================================================
   QUIEBRES: BOTONES DE SELECCION (30-09-2026)
   Luis: con el azul claro "no se sabe que son botones de
   seleccion"; se probo una barra de piezas pegadas y pidio
   "separados, con los bordes redondeados y mas bonito". Cada
   opcion (mes, semana, supervisor, ordenar por y Todo/Altas/
   Migraciones) es un boton blanco suelto, redondeado, con borde y
   sombra; al pasar el mouse sube un poco; el elegido va en azul
   claro con borde azul y un check. Va despues del bloque MENOS
   NEGRO y lo pisa. Para volver a las pildoras: borrar este bloque.
   ============================================================ */
.fila-f:has(> .chip[data-mq]),.fila-f:has(> .chip[data-sq]),.fila-f:has(> .chip[data-su]),
.fila-f:has(> .chip[data-oq]),.fila-f:has(> .chip[data-tp]){gap:8px;margin-bottom:10px}
.fila-f:has(> .chip[data-mq]) .et,.fila-f:has(> .chip[data-sq]) .et,.fila-f:has(> .chip[data-su]) .et,
.fila-f:has(> .chip[data-oq]) .et{width:96px;flex-shrink:0;margin-right:0}
.chip[data-mq],.chip[data-sq],.chip[data-su],.chip[data-oq],.chip[data-tp]{
  background:#fff;border:1px solid #d3dde9;color:#334155;border-radius:10px;
  padding:8px 15px;font-size:12.5px;font-weight:500;line-height:1.2;
  box-shadow:0 1px 2px rgba(20,45,70,.07),0 1px 1px rgba(20,45,70,.04);
  transition:border-color .12s,box-shadow .12s,transform .12s,color .12s}
.chip[data-mq]:not(.on):hover,.chip[data-sq]:not(.on):hover,.chip[data-su]:not(.on):hover,
.chip[data-oq]:not(.on):hover,.chip[data-tp]:not(.on):hover{
  border-color:#93b4ec;color:#1d4ed8;transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(29,78,216,.10)}
.chip.on[data-mq],.chip.on[data-sq],.chip.on[data-su],.chip.on[data-oq],.chip.on[data-tp]{
  background:#eaf2ff;border-color:#3b82f6;color:#1d4ed8;font-weight:700;
  box-shadow:0 0 0 3px rgba(59,130,246,.14)}
.chip.on[data-mq]::before,.chip.on[data-sq]::before,.chip.on[data-su]::before,
.chip.on[data-oq]::before,.chip.on[data-tp]::before{content:'✓';margin-right:6px;font-weight:700}
.chip[data-mq]:focus-visible,.chip[data-sq]:focus-visible,.chip[data-su]:focus-visible,
.chip[data-oq]:focus-visible,.chip[data-tp]:focus-visible{outline:2px solid #1d4ed8;outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  .chip[data-mq],.chip[data-sq],.chip[data-su],.chip[data-oq],.chip[data-tp]{transition:none}
  .chip[data-mq]:hover,.chip[data-sq]:hover,.chip[data-su]:hover,.chip[data-oq]:hover,.chip[data-tp]:hover{transform:none}
}
.qb-tipos .qb-cuenta{margin-left:6px}
/* en el celular el nombre de la fila va arriba */
@media (max-width:700px){
  .fila-f:has(> .chip[data-mq]) .et,.fila-f:has(> .chip[data-sq]) .et,.fila-f:has(> .chip[data-su]) .et,
  .fila-f:has(> .chip[data-oq]) .et{width:100%}
}

/* ============================================================
   QUIEBRES: FILTROS EN UN PANEL, BOTONES "CUADRADOS CON MARCA" (05-10-2026)
   Pedido de Luis: que los botones se vean bien y COMBINEN con el resto
   de la pagina. Eligio el estilo "F" entre doce ejemplos.
   - Se quito el "color por fila" del 30-09 (meses celeste, semanas
     verde, supervisores ambar): esos colores no existian en ninguna
     otra parte y competian con el verde de completadas y el rojo de
     quiebres.
   - Mes, Semana y Supervisor van dentro de un panel blanco igual a los
     demas (.caja.qb-filtros).
   - Todos los botones de seleccion de Quiebres (mes, semana, supervisor,
     "Ordenar por" y Todo/Altas/Migraciones) quedan iguales: rectos, con
     una franja gris a la izquierda. El elegido: fondo azul claro, borde
     y franja azul, letra azul en negrita. Sin check y sin brillo.
   Va despues de "BOTONES DE SELECCION" y lo pisa. Para volver a los
   botones redondeados con check: borrar las tres reglas .chip de abajo.
   ============================================================ */
.caja.qb-filtros{padding:14px 18px 6px;margin:0 0 4px}
.caja.qb-filtros .fila-f:last-child{margin-bottom:8px}
.chip[data-mq],.chip[data-sq],.chip[data-su],.chip[data-oq],.chip[data-tp]{
  border-radius:4px;border-left:4px solid #b9c6d4;box-shadow:none}
.chip.on[data-mq],.chip.on[data-sq],.chip.on[data-su],.chip.on[data-oq],.chip.on[data-tp]{
  background:#eaf2ff;border-color:#1d4ed8;border-left-color:#1d4ed8;color:#1d4ed8;box-shadow:none}
.chip.on[data-mq]::before,.chip.on[data-sq]::before,.chip.on[data-su]::before,
.chip.on[data-oq]::before,.chip.on[data-tp]::before{content:none}
/* nombres de las filas (MES, SEMANA, SUPERVISOR, ORDENAR POR) mas oscuros:
   el gris claro de antes costaba leerlo en proyector (30-09-2026, Luis) */
.fila-f:has(> .chip[data-mq]) .et,.fila-f:has(> .chip[data-sq]) .et,.fila-f:has(> .chip[data-su]) .et,
.fila-f:has(> .chip[data-oq]) .et{color:#475569;font-weight:700}

/* ============================================================
   MOTIVOS DENTRO DE CADA TIPO DE ACTIVIDAD (07-10-2026)
   Las filas que se abren bajo "Alta 1P", "Migracion 2P", etc.
   El nombre del motivo es largo, asi que se le da mas ancho y
   se deja partir en dos lineas. Para revertir: borrar este bloque.
   ============================================================ */
.hijas-caja{background:var(--zebra);border-radius:6px;margin:2px 0 8px;padding:2px 8px 2px 0}
.hijas-caja .lin.hija .nm{width:210px;line-height:1.25}
.hijas-caja .lin.hija:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab">
    <h1 id="titulo">Actividades</h1>
    <div class="sub" id="subtitulo">Cargando…</div>
  </div>
  <div id="vista"></div>
</div>

<script>
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio',
             'agosto','septiembre','octubre','noviembre','diciembre'];
const ESTADOS = [
  {k:'Completado',   cl:'comp', l:'Completadas',  c:'var(--ok)'},
  {k:'No Realizada', cl:'nore', l:'No realizadas', c:'var(--mal)'},
  {k:'Cancelado',    cl:'canc', l:'Canceladas',   c:'var(--ojo)'},
  {k:'Suspendido',   cl:'susp', l:'Suspendidas',  c:'var(--gris)'}
];
let FILAS = [], RUTAS = {}, mesSel = null, diaSel = null, estSel = 'Completado';

/* (30-09-2026, pedido de Luis) Pagina SOLO de quiebres: si se abre con
   #quiebres (boton Quiebres de la barra del Modulo) se muestra como pagina
   propia desde el primer momento: titulo y pestana "Quiebres por tecnico",
   sin "Actividades · Cargando..." mientras baja datos.json y sin el boton
   "← Meses". Sin #quiebres, todo sigue igual que siempre. */
const SOLO_QB = location.hash === '#quiebres';
if(SOLO_QB){
  document.title = 'Quiebres por técnico';
  document.getElementById('titulo').textContent = 'Quiebres por técnico';
  document.getElementById('subtitulo').textContent = 'Cargando las semanas…';
}

/* Etiqueta con la que se muestra cada actividad.
   Las altas, migraciones y traslados se abren en 1P, 2P y 3P.
   Las reparaciones NO: cuentan como una unidad y van en su propia fila,
   igual que en el dashboard de historial por tecnico. */
function categoria(r){
  const t = String(r['Tipo de Actividad'] || '').trim();
  const T = t.toUpperCase();
  if(T.indexOf('REPARAC') === 0) return t;
  const p = parseInt(r['Play'], 10);
  if(p >= 1 && p <= 3 && (T.indexOf('ALTA') === 0 || T.indexOf('MIGRAC') === 0))
    return t + ' ' + p + 'P';
  return t;
}

function esc(s){ return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function pc(a,b){ return b ? (Math.round(1000*a/b)/10).toFixed(1).replace('.',',')+'%' : '—'; }

function expandir(j){
  const dic = j.dic || {};
  return j.rows.map(r => { const o = {};
    j.cols.forEach((c,i) => o[c] = dic[c] ? dic[c][r[i]] : r[i]); return o; });
}
/* las fechas vienen dd-mm-aaaa */
function partes(f){ const p = String(f||'').split('-'); return p.length===3 ? p : null; }
function claveMes(f){ const p = partes(f); return p ? p[2]+'-'+p[1] : null; }
function nombreMes(k){ const p = k.split('-'); return MES[+p[1]-1]+' '+p[0]; }
function ordenDia(f){ const p = partes(f); return p ? p[2]+p[1]+p[0] : ''; }

async function cargar(){
  try{
    const r = await fetch('datos.json?t='+Date.now(), {cache:'no-store'});
    FILAS = expandir(await r.json());
  }catch(e){
    document.getElementById('subtitulo').textContent =
      'No se pudo cargar datos.json. Tiene que estar en la misma carpeta.';
    return;
  }
  try{
    const r = await fetch('https://raw.githubusercontent.com/luis-sepulveda/Rutas-tecnicos/data/historico_dias.json?t='+Date.now(), {cache:'no-store'});
    RUTAS = (await r.json()).dias || {};
  }catch(e){ RUTAS = {}; }
  /* (30-09-2026) Acceso directo: con .../Actividades-diario/#quiebres se
     abre de una la vista de quiebres (lo usa el boton Quiebres de la barra
     del Modulo). "← Meses" sigue llevando a la portada. */
  if(SOLO_QB) verQuiebres();
  else portada();
}

/* ================= PORTADA ================= */
function portada(){
  mesSel = null; diaSel = null;
  document.getElementById('titulo').textContent = 'Actividades';
  const meses = [...new Set(FILAS.map(r => claveMes(r['Fecha'])).filter(Boolean))].sort();
  document.getElementById('subtitulo').textContent =
    'VTR y Claro · Región de Valparaíso · ' + meses.length + (meses.length===1?' mes cargado':' meses cargados');

  const hoy = new Date();
  const kHoy = hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');

  let h = '<div class="meses">';
  meses.forEach(k => {
    const l = FILAS.filter(r => claveMes(r['Fecha']) === k);
    const comp = l.filter(r => r['Estado']==='Completado').length;
    const nore = l.filter(r => r['Estado']==='No Realizada').length;
    const dias = new Set(l.map(r => r['Fecha'])).size;
    h += '<div class="mes" data-m="'+k+'">'
      + '<div class="nom">'+nombreMes(k)+(k===kHoy?'<span class="curso">en curso</span>':'')+'</div>'
      + '<div class="grande">'+pc(comp,l.length)+'</div>'
      + '<div class="bajo">completadas · '+l.length.toLocaleString('es-CL')+' actividades</div>'
      + '<div class="mini">'
      +   '<div><div class="n" style="color:var(--ok)">'+comp.toLocaleString('es-CL')+'</div><div class="l">completadas</div></div>'
      +   '<div><div class="n" style="color:var(--mal-texto)">'+nore.toLocaleString('es-CL')+'</div><div class="l">no realizadas</div></div>'
      +   '<div><div class="n">'+dias+'</div><div class="l">días</div></div>'
      + '</div><div class="ir">Ver el detalle →</div></div>';
  });
  h += '</div>'
    + '<div class="otras"><span class="et">También:</span>'
    + '<button id="btn-qb">Quiebres por técnico</button>'
    + '<button id="btn-rep">Direcciones repetidas</button>'
    + '<a href="pantalla.html">Vista de pantalla</a>'
    + '</div>';
  document.getElementById('vista').innerHTML = h;
  document.querySelectorAll('.mes').forEach(e =>
    e.addEventListener('click', () => { mesSel = e.dataset.m; diaSel = null; estSel = 'Completado'; verMes(); }));
  const br = document.getElementById('btn-rep');
  if(br) br.addEventListener('click', verRepetidas);
  const bq = document.getElementById('btn-qb');
  if(bq) bq.addEventListener('click', verQuiebres);
}

/* ================= DIRECCIONES REPETIDAS =================
   Reporte para reclamarle al mandante. Sale del historial_dir.json que
   arma historial_dir.py en la carpeta de rutas y publica generar_rutas.py.
   Cada direccion trae todas sus visitas con fecha, OT, tecnico, codigo de
   cierre y a que area quedo derivada. Eso ultimo es la prueba: cuando dice
   "Comercial Venta" es el propio sistema del mandante reconociendo que el
   dato lo ingresaron ellos.
   ========================================================= */
const URL_HIST_DIR =
  'https://raw.githubusercontent.com/luis-sepulveda/Rutas-tecnicos/data/historial_dir.json';
let HIST_DIR = null;
let mesRep = null;          // null = todo el periodo; si no, 'AAAA-MM'
/* Codigos que apuntan a un dato mal ingresado por el mandante. */
const CIERRE_DATO_MALO = ['direccion incorrecta','direccion no encontrada','orden mal generada'];

async function verRepetidas(){
  mesSel = null; diaSel = null;
  document.getElementById('titulo').textContent = 'Direcciones repetidas';
  document.getElementById('subtitulo').textContent = 'Cargando el historial…';
  document.getElementById('vista').innerHTML = '';
  if(!HIST_DIR){
    try{
      const r = await fetch(URL_HIST_DIR + '?t=' + Date.now(), {cache:'no-store'});
      HIST_DIR = await r.json();
    }catch(e){
      document.getElementById('subtitulo').textContent =
        'No se pudo cargar el historial de direcciones desde el repo de rutas.';
      document.getElementById('vista').innerHTML =
        '<div class="caja"><button class="btn" id="volver">← Meses</button></div>';
      document.getElementById('volver').addEventListener('click', portada);
      return;
    }
  }
  mesRep = null;
  pintarRepetidas();
}

/* 'dd-mm-aaaa' -> 'aaaa-mm' */
function bonitoMesRep(ym){
  const p = String(ym).split('-');
  return MES[+p[1]-1] + ' ' + p[0];
}

function mesDeVisita(f){
  const p = String(f||'').split('-');
  return p.length === 3 ? p[2]+'-'+p[1] : null;
}

function pintarRepetidas(){
  const H = HIST_DIR || {};
  const todas = H.dirs || [];

  /* Meses que aparecen en el historial, para los botones de arriba. */
  const meses = [...new Set(todas.flatMap(x => (x.v||[]).map(v => mesDeVisita(v.f))))]
                .filter(Boolean).sort();

  /* Con un mes elegido se cuentan SOLO las visitas de ese mes. Una direccion
     aparece si tuvo al menos una visita ahi, y al lado se deja su total
     historico para no perder el contexto. */
  const visitasDe = x => mesRep ? (x.v||[]).filter(v => mesDeVisita(v.f) === mesRep) : (x.v||[]);
  const dirs = todas
    .map(x => ({...x, vm: visitasDe(x)}))
    .filter(x => x.vm.length)
    .sort((a,b) => b.vm.length - a.vm.length || (b.n||0) - (a.n||0));

  document.getElementById('subtitulo').textContent = mesRep
    ? bonitoMesRep(mesRep) + ' · historial desde el ' + (H.desde||'')
    : 'Del ' + (H.desde||'') + ' al ' + (H.hasta||'') + ' · ' + (H.dias||0) + ' días';

  const viajes = dirs.reduce((s,x) => s + x.vm.length, 0);
  const esMalo = v => CIERRE_DATO_MALO.some(k =>
      String(v.cierre||'').toLowerCase().indexOf(k) >= 0);
  const malas  = dirs.filter(x => x.vm.some(esMalo));
  const viajesMalos = malas.reduce((s,x) => s + x.vm.length, 0);

  const der = {};
  let comercial = 0;
  dirs.forEach(x => x.vm.forEach(v => {
    const d = String(v.deriv || '').trim();
    if(!d) return;
    der[d] = (der[d]||0) + 1;
    if(d.toLowerCase().indexOf('comercial') >= 0) comercial++;
  }));

  const chips = '<div class="fila-f"><span class="et">Período</span>'
    + '<button class="chip'+(!mesRep?' on':'')+'" data-mr="">Todo</button>'
    + meses.map(m => '<button class="chip'+(mesRep===m?' on':'')+'" data-mr="'+m+'">'
        + bonitoMesRep(m)+'</button>').join('')
    + '</div>';

  /* cuantas direcciones por cantidad de visitas (en el periodo elegido) */
  const porN = {};
  dirs.forEach(x => { const k = Math.min(x.vm.length, 5); porN[k] = (porN[k]||0)+1; });
  const etiqueta = k => k >= 5 ? '5 o más visitas' : k + ' visitas';

  let barrasN = '';
  Object.keys(porN).sort((a,b) => a-b).forEach(k => {
    const v = porN[k], max = Math.max(...Object.values(porN));
    barrasN += '<div class="lin"><span class="nm">'+etiqueta(+k)+'</span>'
      + '<div class="pista"><span style="width:'+(100*v/max)+'%;background:'
      + (+k >= 4 ? 'var(--mal)' : +k === 3 ? 'var(--amarillo)' : 'var(--gris)')+'"></span></div>'
      + '<span class="vl">'+v+'</span>'
      + '<span class="pc">'+pc(v, dirs.length)+'</span></div>';
  });

  let barrasD = '';
  Object.entries(der).sort((a,b) => b[1]-a[1]).slice(0,6).forEach(([k,v]) => {
    const esCom = k.toLowerCase().indexOf('comercial') >= 0;
    const max = Math.max(...Object.values(der));
    barrasD += '<div class="lin"><span class="nm"'
      + (esCom ? ' style="color:var(--mal-texto);font-weight:700"' : '')+'>'+esc(k)+'</span>'
      + '<div class="pista"><span style="width:'+(100*v/max)+'%;background:'
      + (esCom ? 'var(--mal)' : 'var(--gris)')+'"></span></div>'
      + '<span class="vl">'+v+'</span></div>';
  });

  let lista = '';
  dirs.slice(0, 60).forEach((x, i) => {
    const nv = x.vm.length;
    const cl = nv >= 5 ? ' alta' : nv >= 3 ? ' media' : '';
    const id = 'rep'+i;
    const extra = (mesRep && (x.n||0) > nv)
      ? ' <span style="color:var(--debil);font-size:11.5px">· '+x.n+' en total</span>' : '';
    lista += '<div class="rep-fila'+cl+'" data-abre="'+id+'">'
      + '<span class="veces">'+nv+'</span>'
      + '<span class="dirn">'+esc(x.d||'')+extra+'</span>'
      + '<span class="ultv">última '+esc(x.ult||'')+'</span>'
      + '<span class="fle">▾</span></div>'
      + '<div id="'+id+'" class="rep-det" style="display:none"><table><tbody>';
    /* el detalle muestra SIEMPRE todas las visitas: el caso se entiende
       entero, y las del mes elegido van resaltadas */
    (x.v||[]).forEach(v => {
      const malo = CIERRE_DATO_MALO.some(k =>
        String(v.cierre||'').toLowerCase().indexOf(k) >= 0);
      const delMes = mesRep && mesDeVisita(v.f) === mesRep;
      lista += '<tr'+(delMes ? ' style="background:var(--zebra)"' : '')+'>'
        + '<td style="width:88px"'+(delMes ? ' class="malo"' : '')+'>'+esc(v.f||'')+'</td>'
        + '<td class="ot">'+esc(v.o||'')+'</td>'
        + '<td>'+esc(v.tec||'')+'</td>'
        + '<td>'+esc(v.cat||'')+'</td>'
        + '<td'+(malo ? ' class="malo"' : '')+'>'+esc(v.cierre || 'Completada')+'</td>'
        + '<td class="der">'+esc(v.deriv||'')+'</td></tr>';
    });
    lista += '</tbody></table></div>';
  });

  document.getElementById('vista').innerHTML = `
  <div class="fila-f"><button class="btn" id="volver">← Meses</button></div>
  ${chips}

  <div class="caja">
    <h2>Viajes a direcciones ya visitadas${mesRep ? ' <span class="chico">contando solo las visitas de '+bonitoMesRep(mesRep)+'</span>' : ''}</h2>
    <div class="cifras">
      <div class="cifra"><div class="n">${viajes}</div><div class="l">viajes repetidos</div></div>
      <div class="cifra"><div class="n">${dirs.length}</div><div class="l">direcciones</div></div>
      <div class="cifra"><div class="n" style="color:var(--mal-texto)">${malas.length}</div><div class="l">con dato mal ingresado</div></div>
      <div class="cifra"><div class="n" style="color:var(--mal-texto)">${viajesMalos}</div><div class="l">viajes a esas</div></div>
      <div class="cifra"><div class="n" style="color:var(--mal-texto)">${comercial}</div><div class="l">derivadas a Comercial</div></div>
    </div>
  </div>

  <div class="grid2">
    <div class="caja"><h2>Cuántas veces se visitó cada dirección</h2>${barrasN}</div>
    <div class="caja"><h2>A qué área quedó derivada la visita</h2>${barrasD}</div>
  </div>

  <div class="caja">
    <h2>Detalle <span class="chico">las ${Math.min(60, dirs.length)} más visitadas · toca una para ver cada visita</span></h2>
    ${lista}
  </div>`;

  document.getElementById('volver').addEventListener('click', portada);
  document.querySelectorAll('.chip[data-mr]').forEach(b =>
    b.addEventListener('click', () => { mesRep = b.dataset.mr || null; pintarRepetidas(); }));
  document.querySelectorAll('.rep-fila').forEach(f =>
    f.addEventListener('click', () => {
      const c = document.getElementById(f.dataset.abre);
      const ab = c.style.display !== 'none';
      c.style.display = ab ? 'none' : 'block';
      f.querySelector('.fle').textContent = ab ? '▾' : '▴';
    }));
  window.scrollTo(0,0);
}

/* ================= DETALLE DEL MES ================= */
function activas(){
  let l = FILAS.filter(r => claveMes(r['Fecha']) === mesSel);
  if(diaSel) l = l.filter(r => r['Fecha'] === diaSel);
  return l;
}

function verMes(){
  document.getElementById('titulo').textContent = nombreMes(mesSel).replace(/^./, c => c.toUpperCase());
  const todas = activas();
  document.getElementById('subtitulo').textContent =
    todas.length.toLocaleString('es-CL') + ' actividades' + (diaSel ? ' · '+diaSel : ' · todo el mes');

  const dias = [...new Set(FILAS.filter(r => claveMes(r['Fecha'])===mesSel).map(r => r['Fecha']))]
               .sort((a,b) => ordenDia(a).localeCompare(ordenDia(b)));

  let h = '<div class="fila-f"><button class="btn" id="volver">← Meses</button></div>'
        + '<div class="fila-f"><span class="et">Día</span>'
        + '<button class="chip'+(!diaSel?' on':'')+'" data-d="">Todo el mes</button>';
  dias.forEach(d => h += '<button class="chip'+(diaSel===d?' on':'')+'" data-d="'+d+'">'+d.slice(0,5)+'</button>');
  h += '</div><div class="estados">';

  ESTADOS.forEach(e => {
    const n = todas.filter(r => r['Estado']===e.k).length;
    /* Completadas (25-09-2026, pedido de Luis): dentro de la misma tarjeta,
       el total de actividades asignadas y la efectividad (completadas sobre
       asignadas, el mismo % de siempre, con nombre). */
    const pie = e.k === 'Completado'
      ? '<div class="p">de <b>'+todas.length.toLocaleString('es-CL')+'</b> asignadas</div>'
        + '<div class="ef">Efectividad <b>'+pc(n,todas.length)+'</b></div>'
      : '<div class="p">'+pc(n,todas.length)+' del total</div>';
    h += '<div class="est '+e.cl+(estSel===e.k?' on':'')+'" data-e="'+e.k+'">'
      + '<div class="n">'+n.toLocaleString('es-CL')+'</div><div class="l">'+e.l+'</div>'
      + pie + '</div>';
  });
  h += '</div>';

  /* --- desglose del estado elegido --- */
  const sel = todas.filter(r => r['Estado']===estSel);
  const et = ESTADOS.find(e => e.k===estSel);
  h += '<div class="grid2">';
  /* (07-10-2026) en No realizadas y Canceladas cada tipo se abre y muestra
     sus motivos de cierre. En las otras dos tarjetas no: no hay motivo. */
  const conMotivo = (estSel === 'No Realizada' || estSel === 'Cancelado');
  h += '<div class="caja"><h2>'+et.l+' por tipo de actividad'
     + '<span class="chico">'+sel.length.toLocaleString('es-CL')+' órdenes'
     + (conMotivo ? ' · toca un tipo para ver sus motivos' : '')+'</span></h2>'
     + barras(sel, categoria, null, false, conMotivo ? 'Código de Cierre' : null) + '</div>';

  if(estSel === 'No Realizada'){
    h += panelCulpa(sel);
  }
  if(estSel === 'No Realizada' || estSel === 'Cancelado'){
    h += '<div class="caja"><h2>Motivo de cierre'
       + '<span class="chico">las más relevantes</span></h2>'
       + barras(sel, 'Código de Cierre', null, true) + '</div>';
  } else {
    h += '<div class="caja"><h2>Por ciudad</h2>' + barras(sel, 'Ciudad', 6) + '</div>';
  }
  h += '</div>';

  h += '<div class="grid2"><div class="caja"><h2>Por supervisor</h2>'
     + barras(sel, 'supervisor') + '</div>'
     + '<div class="caja"><h2>Por franja horaria</h2>' + barras(sel, 'Franja') + '</div></div>';

  /* --- lo que paso en rutas --- */
  h += '<div class="caja"><h2>Monitor de rutas'
     + (diaSel ? '<span class="chico">'+diaSel+'</span>' : '<span class="chico">elige un día</span>')
     + '</h2>' + panelRutas() + '</div>';

  document.getElementById('vista').innerHTML = h;
  document.getElementById('volver').addEventListener('click', portada);
  document.querySelectorAll('.lin.abrir').forEach(f =>
    f.addEventListener('click', () => {
      const caja = document.getElementById(f.dataset.abre);
      const abierta = caja.style.display !== 'none';
      caja.style.display = abierta ? 'none' : 'block';
      f.classList.toggle('abierta', !abierta);
    }));
  document.querySelectorAll('.chip[data-d]').forEach(b =>
    b.addEventListener('click', () => { diaSel = b.dataset.d || null; grupoSel = null; verMes(); }));
  document.querySelectorAll('.est').forEach(b =>
    b.addEventListener('click', () => { estSel = b.dataset.e; verMes(); }));
  document.querySelectorAll('.rutas .r.abre').forEach(b =>
    b.addEventListener('click', () => {
      grupoSel = (grupoSel === b.dataset.g) ? null : b.dataset.g;
      verMes();
    }));
  window.scrollTo(0,0);
}

/* Motivos que siempre se muestran aunque tengan pocas ordenes: son los que
   se miran si o si. La falta de dotacion ademas sale en amarillo, porque no
   es una falla del tecnico sino que no hubo quien la tomara. */
/* ============ DE QUIEN FUE LA CAIDA ============
   Reparte los motivos de cierre en tres responsables. Sirve para responder
   con numero cuando preguntan por el porcentaje de no realizadas: la mayoria
   no son de la empresa.

   - cliente : no estaba, reagenda, desiste, ductos tapados. Nadie lo
               controla. Ductos tapados va aqui desde el 30-09-2026 (Luis):
               el ducto es de la casa del cliente, no de la red de VTR/CLARO.
   - mandante: VTR/Claro. Incluye la red (NAP, aprovisionamiento) y
               los datos mal ingresados por su area comercial (direccion
               incorrecta o no encontrada, nombre del cliente, etc).
   - empresa : lo unico que depende de nosotros (falta de dotacion).

   Si aparece un codigo nuevo cae en 'empresa' a proposito, para que se note
   y se clasifique, en vez de esconderse en el saco de los demas. */
const CULPA_CLIENTE  = ['sin moradores','reagenda','desiste','sin contacto',
                        'sin acceso','sin apoyo','casa sin medidor','ducto'];
const CULPA_MANDANTE = ['falla','nap','sin red','niveles','poste',
                        'factible','masiva','contingencia','direccion',
                        'derivaci','ticket','zona roja','riesgo','mal generada'];

function culpaDe(codigo){
  const c = String(codigo || '').toLowerCase();
  if(CULPA_CLIENTE.some(k => c.indexOf(k) >= 0))  return 'cliente';
  if(CULPA_MANDANTE.some(k => c.indexOf(k) >= 0)) return 'mandante';
  return 'empresa';
}

const CIERRES_CLAVE = ['sin moradores','cliente reagenda','cliente desiste','dotaci'];
/* Un motivo entra si pesa al menos este porcentaje del total. Con 5 salian
   17 filas y eso ya no es "lo relevante". Si quieres ver mas, baja el numero. */
const MINIMO_CIERRE = 2;

let _nOtras = 0;

/* Lista las ordenes de un motivo de cierre: numero de peticion y tecnico.
   Ordenada por tecnico, que es como se revisa cuando hay que reclamar. */
function tablaOrdenes(filas){
  if(!filas.length) return '';
  const orden = filas.slice().sort((a,b) =>
    String(a['Nombre']||'').localeCompare(String(b['Nombre']||'')));
  let h = '<table class="tdet"><thead><tr><th>Orden de trabajo</th><th>Técnico</th>'
        + '<th>Actividad</th><th>Franja</th><th>Ciudad</th></tr></thead><tbody>';
  orden.forEach(r => {
    h += '<tr><td class="ot">'+esc(r['Orden de Trabajo'] || '')+'</td>'
      + '<td>'+esc(r['Nombre'] || '')+'</td>'
      + '<td>'+esc(r['Tipo de Actividad'] || '')+'</td>'
      + '<td>'+esc(r['Franja'] || '')+'</td>'
      + '<td class="dir">'+esc(r['Ciudad'] || '')+'</td></tr>';
  });
  return h + '</tbody></table>';
}
/* 'hijasPor' (07-10-2026, pedido de Luis): si viene un campo, cada fila se
   puede abrir y muestra debajo como se reparten SUS ordenes segun ese campo.
   Se usa en "No realizadas por tipo de actividad": al tocar "Alta 1P" salen
   los motivos de cierre de esas ordenes, con su cantidad y el % sobre el
   total de ese tipo (no sobre el total del panel). */
function barras(lista, campo, tope, relevantes, hijasPor){
  const col = (ESTADOS.find(e => e.k === estSel) || {}).c || 'var(--frio)';
  if(!lista.length) return '<div class="vacio">Sin órdenes en esta selección.</div>';
  const c = {};
  const filasDe = {};          // las ordenes de cada grupo, para el detalle
  const sacar = typeof campo === 'function' ? campo : (r => r[campo]);
  lista.forEach(r => {
    const v = sacar(r) || 'Sin dato';
    c[v] = (c[v]||0)+1;
    (filasDe[v] = filasDe[v] || []).push(r);
  });
  let pares = Object.entries(c).sort((a,b) => b[1]-a[1]);
  let otras = [];
  if(relevantes){
    /* se muestran los motivos con peso propio y los que siempre importan;
       el resto se junta al final para no perder el total */
    const vale = ([k,v]) => (100*v/lista.length) >= MINIMO_CIERRE ||
      CIERRES_CLAVE.some(p => String(k).toLowerCase().indexOf(p) >= 0);
    otras = pares.filter(x => !vale(x));
    pares = pares.filter(vale);
  } else if(tope && pares.length > tope){
    otras = pares.slice(tope);
    pares = pares.slice(0, tope);
  }
  if(!pares.length){ pares = otras; otras = []; }
  const max = pares[0][1];
  let h = '';
  pares.forEach(([k,v]) => {
    const dotacion = String(k).toLowerCase().indexOf('dotaci') >= 0;
    /* en el panel de motivos cada fila se abre y muestra sus ordenes */
    const id = relevantes ? 'mot'+(++_nOtras) : (hijasPor ? 'tip'+(++_nOtras) : null);
    h += '<div class="lin'+(id ? ' abrir' : '')+'"'+(id ? ' data-abre="'+id+'"' : '')+'>'
      + '<span class="nm"'
      + (dotacion ? ' style="color:var(--amarillo2);font-weight:700"' : '')+'>'+esc(k)+'</span>'
      + '<div class="pista"><span style="width:'+(100*v/max)+'%;background:'
      + (dotacion ? 'var(--amarillo)' : col)+'"></span></div>'
      + '<span class="vl">'+v.toLocaleString('es-CL')+'</span>'
      + '<span class="pc">'+pc(v,lista.length)+'</span></div>';
    if(id && hijasPor){
      /* motivos de este grupo, de mas a menos */
      const suyas = filasDe[k] || [];
      const cm = {};
      suyas.forEach(r => { const m = r[hijasPor] || 'Sin dato'; cm[m] = (cm[m]||0)+1; });
      const pm = Object.entries(cm).sort((a,b) => b[1]-a[1]);
      const maxm = pm.length ? pm[0][1] : 1;
      h += '<div id="'+id+'" class="hijas-caja" style="display:none">';
      pm.forEach(([m,n]) => {
        const dot = String(m).toLowerCase().indexOf('dotaci') >= 0;
        h += '<div class="lin hija"><span class="nm"'
          + (dot ? ' style="color:var(--amarillo2);font-weight:700"' : '')+'>'+esc(m)+'</span>'
          + '<div class="pista"><span style="width:'+(100*n/maxm)+'%;background:'
          + (dot ? 'var(--amarillo)' : col)+';opacity:.55"></span></div>'
          + '<span class="vl">'+n.toLocaleString('es-CL')+'</span>'
          + '<span class="pc">'+pc(n,suyas.length)+'</span></div>';
      });
      h += '</div>';
    } else if(id){
      h += '<div id="'+id+'" style="display:none">'
         + tablaOrdenes(filasDe[k] || []) + '</div>';
    }
  });
  if(otras.length){
    const s = otras.reduce((a,b) => a+b[1], 0);
    const id = 'otras'+(++_nOtras);
    h += '<div class="lin abrir" data-abre="'+id+'">'
      + '<span class="nm" style="color:var(--debil)">Otras '+otras.length+'</span>'
      + '<div class="pista"><span style="width:'+(100*s/max)+'%;background:var(--debil)"></span></div>'
      + '<span class="vl">'+s+'</span><span class="pc">'+pc(s,lista.length)+'</span></div>'
      + '<div id="'+id+'" style="display:none">';
    otras.forEach(([k,v]) => {
      h += '<div class="lin hija"><span class="nm">'+esc(k)+'</span>'
        + '<div class="pista"><span style="width:'+(100*v/max)+'%;background:var(--debil)"></span></div>'
        + '<span class="vl">'+v+'</span><span class="pc">'+pc(v,lista.length)+'</span></div>';
    });
    h += '</div>';
  }
  return h;
}

/* Grupos que se pueden abrir. La llave es la que guarda resumen_dia.py
   dentro de 'detalle'. Los dias anteriores al cambio no traen detalle: ahi
   los recuadros quedan como estaban, solo con el numero. */
const GRUPOS_RUTAS = {caidas:'caídas', nuevas:'órdenes nuevas',
                      repetidas:'repetidas', reagendadas:'reagendadas'};
let grupoSel = null;

/* Bloque de responsables. Va completo, no dentro de la reja de dos columnas,
   porque es el numero que se lleva a reunion. */
function panelCulpa(lista){
  if(!lista.length) return '';
  const c = {cliente:0, mandante:0, empresa:0};
  const det = {cliente:{}, mandante:{}, empresa:{}};
  lista.forEach(r => {
    const k = culpaDe(r['Código de Cierre']);
    c[k]++;
    const m = r['Código de Cierre'] || 'Sin código';
    det[k][m] = (det[k][m] || 0) + 1;
  });
  const t = lista.length;
  const p = v => Math.round(1000*v/t)/10;
  const top = o => Object.entries(o).sort((a,b) => b[1]-a[1]).slice(0,3)
                     .map(x => x[0]).join(' · ') || '—';

  const seg = (v, cl) => v ? `<span class="${cl}" style="width:${100*v/t}%">${
    p(v) >= 8 ? p(v).toFixed(1).replace('.',',')+'%' : ''}</span>` : '';

  const fila = (v, cl, tit, sub) => `<div class="f"><span class="pt ${cl}"></span>
      <span class="tx">${tit}<small>${sub}</small></span>
      <span class="vv">${v}</span>
      <span class="pp">${p(v).toFixed(1).replace('.',',')}%</span></div>`;

  return `<div class="caja">
    <h2>De quién fue la caída <span class="chico">${t} órdenes no realizadas</span></h2>
    <div class="culpa">${seg(c.cliente,'cul-cli')}${seg(c.mandante,'cul-man')}${seg(c.empresa,'cul-nos')}</div>
    <div class="cul-lista">
      ${fila(c.cliente,'cul-cli','Del cliente', top(det.cliente))}
      ${fila(c.mandante,'cul-man','Del mandante · VTR/Claro', top(det.mandante))}
      ${fila(c.empresa,'cul-nos','De la empresa', top(det.empresa))}
    </div>
  </div>`;
}

function panelRutas(){
  if(!diaSel) return '<div class="vacio">Elige un día arriba para ver las caídas y las órdenes nuevas de esa jornada.</div>';
  const d = RUTAS[diaSel];
  if(!d) return '<div class="vacio">El monitor no tiene registro de este día. Empezó a guardar el 05-09-2026.</div>';
  const det = d.detalle || {};

  const r = (v, l, cl, g) => {
    const lista = g ? (det[g] || null) : null;
    const abre = lista && lista.length;
    return '<div class="r '+(cl||'')+(abre ? ' abre' : '')+(grupoSel===g ? ' on' : '')+'"'
      + (abre ? ' data-g="'+g+'"' : '')+'>'
      + '<div class="n">'+(v ?? 0)+'</div><div class="l">'+l+'</div>'
      + (abre ? '<div class="ver">ver detalle</div>' : '')+'</div>';
  };

  let h = '<div class="rutas">'
    + r(d.caidas_total,'caídas','caida','caidas')
    + r(d.caidas_activas,'sin resolver','caida')
    + r(d.caidas_resueltas,'resueltas')
    + r(d.nuevas,'órdenes nuevas',null,'nuevas')
    + r(d.al_bucket,'al bucket')
    + r(d.repetidas,'repetidas',null,'repetidas')
    + r(d.reagendadas,'reagendadas',null,'reagendadas')
    + r(d.rgu,'RGU')
    + '</div>';

  if(grupoSel && (det[grupoSel] || []).length){
    h += tablaDetalle(grupoSel, det[grupoSel]);
  }
  h += '<div class="vacio">Corte de las '+d.hasta+' · '+d.actividades
     + ' actividades · '+d.tecnicos+' técnicos'
     + (d.detalle ? '' : ' · este día se guardó antes de que el monitor anotara el detalle')
     + '</div>';
  return h;
}

function tablaDetalle(grupo, filas){
  const repe = grupo === 'repetidas', reag = grupo === 'reagendadas';
  let h = '<table class="tdet"><thead><tr>'
    + '<th>OT</th><th>Técnico</th><th>Actividad</th><th>Franja</th><th>Dirección</th>'
    + (repe ? '<th>Visitas</th><th>Última vez</th>' : '')
    + (reag ? '<th>Venía del</th>' : '')
    + '<th>Estado</th></tr></thead><tbody>';
  filas.forEach(f => {
    h += '<tr><td class="ot">'+esc(f.o || '')+'</td>'
      + '<td>'+esc(f.tec || '')+'</td>'
      + '<td>'+esc(f.cat || '')+'</td>'
      + '<td>'+esc(f.f || '')+'</td>'
      + '<td class="dir">'+esc(f.d || '')+'</td>'
      + (repe ? '<td>'+(f.visitas ?? '')+'</td><td class="dir">'
                + esc(f.ult_fecha || '')+(f.ult_cierre ? ' · '+esc(f.ult_cierre) : '')+'</td>' : '')
      + (reag ? '<td class="dir">'+esc(f.desde || '')+'</td>' : '')
      + '<td>'+esc(f.e || '')+'</td></tr>';
  });
  return h + '</tbody></table>';
}

/* ================= QUIEBRES POR TECNICO (30-09-2026) =================
   Pedido de Luis: VTR/CLARO mide los quiebres por tecnico ("le cargamos
   100 actividades y ejecuto 50, que paso con las otras"). Esta vista
   responde esa pregunta semana a semana, con numeros y orden por orden.

   Definiciones (las mismas del resto del dashboard):
   - Asignadas: todas las ordenes del tecnico en la semana, UNA por orden y
     dia (generar_csv.py ya deja el estado final). Una orden que se
     reagenda y vuelve otro dia cuenta de nuevo ese dia, igual que en la
     efectividad.
   - Quiebre: toda orden que no termino Completada (No Realizada,
     Cancelada o Suspendida). La regla GSA ya viene aplicada: esas cuentan
     como Completado.
   - Semana: de lunes a sabado, la misma que usa VTR/CLARO para el 50% de
     sin moradores. Si algun domingo trae ordenes, suma a su semana.
   - Tecnico: nombre corto, lo que va despues de "_DOMI_". Asi se juntan
     los que aparecen con dos prefijos (MM_ y QA_MM_). Las filas sin
     "_DOMI_" (buckets) no entran.

   De quien es cada quiebre: las No Realizadas usan culpaDe(), el mismo
   criterio del panel "De quien fue la caida". Las Canceladas van a
   VTR/CLARO: se cancelan en su sistema, el tecnico no cancela. Las
   Suspendidas van aparte: es un estado que VTR/CLARO no alcanzo a cerrar.

   "Se completo otro dia": la misma OT aparece Completada en una fecha
   posterior (con cualquier tecnico). Es el argumento de que el trabajo no
   se perdio, solo se movio de dia.

   Limite conocido: el export dice quien tenia la orden AL FINAL del dia.
   Si VTR/CLARO le movio una orden a otro tecnico, aqui cuenta para el
   que la termino, no para el que la tenia en la manana. Para medir eso
   haria falta cruzar con el Excel de inicio de jornada (pendiente).
   =================================================================== */
const MES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
const QB_RESP = {
  cliente : {l:'Del cliente',            c:'Cliente',    cl:'cli', css:'cul-cli'},
  mandante: {l:'De VTR/CLARO',           c:'VTR/CLARO',  cl:'man', css:'cul-man'},
  empresa : {l:'De Dominion',            c:'Dominion',   cl:'nos', css:'cul-nos'},
  susp    : {l:'Suspendidas sin cerrar', c:'Suspendida', cl:'sus', css:'cul-sus'}
};
/* Solo altas y migraciones (30-09-2026, pedido de Luis): es lo que mide
   VTR/CLARO en los quiebres. Entran los tipos que EMPIEZAN con estas
   palabras, asi que "Alta" incluye "Alta Traslado". Quedan fuera
   reparaciones, modificaciones, upgrade y downgrade. Para volver a contar
   todo, dejar la lista vacia: []. */
const QB_TIPOS = ['ALTA', 'MIGRAC'];
/* Botones Todo / Altas / Migraciones (30-09-2026, pedido de Luis). Primero
   iban en el recuadro "Por tecnico" y filtraban toda la vista; el mismo dia
   se movieron al DETALLE de cada tecnico (ver detalleTecnico). tipoQb queda
   siempre en 'todo' para la vista general; tipoDetQb es el del detalle.
   "Todo" = altas + migraciones: las reparaciones siguen fuera. */
let tipoQb = 'todo';                    // 'todo' | 'ALTA' | 'MIGRAC'
let tipoDetQb = 'todo';                 // el mismo filtro, pero solo del detalle abierto
const QB_BOTONES_TIPO = [['todo','Todo'], ['ALTA','Altas'], ['MIGRAC','Migraciones']];
function tipoQuiebre(r){
  const T = String(r['Tipo de Actividad'] || '').trim().toUpperCase();
  if(tipoQb !== 'todo') return T.indexOf(tipoQb) === 0;
  if(!QB_TIPOS.length) return true;
  return QB_TIPOS.some(k => T.indexOf(k) === 0);
}
function textoTiposQb(){
  return tipoQb === 'ALTA' ? 'solo altas' : tipoQb === 'MIGRAC' ? 'solo migraciones'
       : 'solo altas y migraciones';
}

/* Con este % de quiebre o mas, el numero de la tabla sale en rojo. */
const QB_ALTO = 40;

let semQb = null, supQb = null, ordenQb = 'q', abiertoQb = null;
let QB_OT = null;   // OT -> fechas (aaaammdd) en que salio Completada

function fechaD(f){ const p = partes(f); return p ? new Date(+p[2], +p[1]-1, +p[0]) : null; }
function claveSem(f){
  const d = fechaD(f); if(!d) return null;
  d.setDate(d.getDate() - (d.getDay()+6)%7);          // lunes de esa semana
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function numSemana(k){
  /* semana ISO, la misma "Sem 39" del reporte de Seguimiento */
  const p = k.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + 3);                         // jueves de esa semana
  const ene4 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - ene4)/86400000 - 3 + (ene4.getDay()+6)%7) / 7);
}
function rangoSemana(k){
  const p = k.split('-'), a = new Date(+p[0], +p[1]-1, +p[2]);
  const b = new Date(a); b.setDate(a.getDate() + 5);  // sabado
  return a.getMonth() === b.getMonth()
    ? 'del '+a.getDate()+' al '+b.getDate()+' '+MES_CORTO[b.getMonth()]
    : 'del '+a.getDate()+' '+MES_CORTO[a.getMonth()]+' al '+b.getDate()+' '+MES_CORTO[b.getMonth()];
}
function tecCorto(n){
  const s = String(n || ''), i = s.indexOf('_DOMI_');
  return i >= 0 ? s.slice(i + 6).trim() : null;
}
function respQuiebre(r){
  if(r['Estado'] === 'Cancelado')  return 'mandante';
  if(r['Estado'] === 'Suspendido') return 'susp';
  return culpaDe(r['Código de Cierre']);
}
function motivoQuiebre(r){
  const c = String(r['Código de Cierre'] || '').trim();
  if(r['Estado'] === 'Cancelado')
    return !c ? 'Cancelada' : c.toLowerCase().indexOf('cancel') >= 0 ? c : 'Cancelada · '+c;
  if(r['Estado'] === 'Suspendido') return 'Suspendida';
  return c || 'Sin código';
}
function completadaDespues(r){
  if(!QB_OT){
    QB_OT = {};
    FILAS.forEach(x => { if(x['Estado'] === 'Completado'){
      const o = x['Orden de Trabajo']; (QB_OT[o] = QB_OT[o] || []).push(ordenDia(x['Fecha'])); } });
  }
  const hoy = ordenDia(r['Fecha']);
  const l = (QB_OT[r['Orden de Trabajo']] || []).filter(f => f > hoy).sort();
  return l.length ? l[0].slice(6,8)+'-'+l[0].slice(4,6) : null;
}

/* Arma la tabla de una semana: un objeto por tecnico. */
function calcularQuiebres(semana, sup){
  const t = {};
  FILAS.forEach(r => {
    if(claveSem(r['Fecha']) !== semana) return;
    if(!tipoQuiebre(r)) return;
    const tec = tecCorto(r['Nombre']); if(!tec) return;
    if(sup && r['supervisor'] !== sup) return;
    const o = t[tec] = t[tec] || {tec, sups:{}, asig:0, comp:0, q:0,
                                  resp:{cliente:0, mandante:0, empresa:0, susp:0},
                                  mot:{cliente:{}, mandante:{}, empresa:{}, susp:{}},
                                  filas:[], recup:0};
    o.asig++;
    o.sups[r['supervisor'] || '—'] = (o.sups[r['supervisor'] || '—'] || 0) + 1;
    if(r['Estado'] === 'Completado'){ o.comp++; return; }
    o.q++;
    const k = respQuiebre(r), m = motivoQuiebre(r);
    o.resp[k]++;
    o.mot[k][m] = (o.mot[k][m] || 0) + 1;
    const desp = completadaDespues(r);
    if(desp) o.recup++;
    o.filas.push({r, k, m, desp});
  });
  return Object.values(t).map(o => {
    o.sup = Object.entries(o.sups).sort((a,b) => b[1]-a[1])[0][0];
    o.pq = o.asig ? 100*o.q/o.asig : 0;
    return o;
  });
}

function nfQ(v){ return (Math.round(v*10)/10).toFixed(1).replace('.',','); }

/* Semanas agrupadas por mes (30-09-2026, pedido de Luis): primero se elige
   el mes y abajo salen sus semanas. Cada semana va al mes donde tiene MAS
   DIAS CON DATOS, la misma regla del "Semana a semana" de Seguimiento.
   Ej.: la del 28-09 al 03-10 es de septiembre mientras solo tenga 28 y 29;
   cuando octubre tenga mas dias cargados, se pasa a octubre. En empate,
   gana el mes mas nuevo. */
let mesQb = null;
let QB_MES_SEM = {};                    // semana -> 'aaaa-mm'
function mesDeSemana(k){
  const c = {};
  new Set(FILAS.filter(r => claveSem(r['Fecha']) === k).map(r => r['Fecha']))
    .forEach(f => { const m = claveMes(f); c[m] = (c[m] || 0) + 1; });
  return Object.entries(c).sort((a,b) => b[1]-a[1] || b[0].localeCompare(a[0]))[0][0];
}

function verQuiebres(){
  mesSel = null; diaSel = null;
  const semanas = [...new Set(FILAS.map(r => claveSem(r['Fecha'])).filter(Boolean))].sort().reverse();
  QB_MES_SEM = {};
  semanas.forEach(k => QB_MES_SEM[k] = mesDeSemana(k));
  if(!semQb || semanas.indexOf(semQb) < 0) semQb = semanas[0];
  mesQb = QB_MES_SEM[semQb];
  pintarQuiebres(semanas);
}

function pintarQuiebres(semanas){
  document.getElementById('titulo').textContent = 'Quiebres por técnico';
  const ultimoDia = [...new Set(FILAS.filter(r => claveSem(r['Fecha']) === semQb).map(r => r['Fecha']))]
                    .sort((a,b) => ordenDia(a).localeCompare(ordenDia(b))).pop() || '';
  const enCurso = semQb === semanas[0];
  document.getElementById('subtitulo').textContent = 'Semana ' + numSemana(semQb) + ', '
    + rangoSemana(semQb) + (enCurso ? ' · en curso, con datos hasta el ' + ultimoDia.slice(0,5) : '')
    + (QB_TIPOS.length || tipoQb !== 'todo' ? ' · ' + textoTiposQb() : '');

  const sups = [...new Set(FILAS.map(r => r['supervisor']).filter(Boolean))].sort();
  const tecs = calcularQuiebres(semQb, supQb);
  tecs.sort(ordenQb === 'p' ? (a,b) => b.pq - a.pq || b.q - a.q : (a,b) => b.q - a.q || b.pq - a.pq);

  const tot = {asig:0, comp:0, q:0, recup:0, resp:{cliente:0, mandante:0, empresa:0, susp:0}};
  tecs.forEach(o => { tot.asig += o.asig; tot.comp += o.comp; tot.q += o.q; tot.recup += o.recup;
                      Object.keys(tot.resp).forEach(k => tot.resp[k] += o.resp[k]); });

  let h = (SOLO_QB ? '' : '<div class="fila-f"><button class="btn" id="volver">← Meses</button></div>')
    + '<div class="caja qb-filtros"><div class="fila-f"><span class="et">Mes</span>'
    + [...new Set(semanas.map(k => QB_MES_SEM[k]))].sort().reverse()
        .map(m => '<button class="chip qb-mes'+(m===mesQb?' on':'')+'" data-mq="'+m+'">'
          + nombreMes(m)+'</button>').join('')
    + '</div><div class="fila-f"><span class="et">Semana</span>'
    + semanas.filter(k => QB_MES_SEM[k] === mesQb).sort()
        .map(k => '<button class="chip'+(k===semQb?' on':'')+'" data-sq="'+k+'">Sem '
          + numSemana(k)+' · '+rangoSemana(k).replace('del ','')+'</button>').join('')
    + '</div><div class="fila-f"><span class="et">Supervisor</span>'
    + '<button class="chip'+(!supQb?' on':'')+'" data-su="">Todos</button>'
    + sups.map(s => '<button class="chip'+(supQb===s?' on':'')+'" data-su="'+esc(s)+'">'+esc(s)+'</button>').join('')
    + '</div></div>';

  /* tarjetas del total de la semana */
  h += '<div class="estados qb-est">'
    + '<div class="est"><div class="n">'+tot.asig.toLocaleString('es-CL')+'</div><div class="l">Asignadas</div>'
    +   '<div class="p">'+tecs.length+' técnicos</div></div>'
    + '<div class="est comp"><div class="n">'+tot.comp.toLocaleString('es-CL')+'</div><div class="l">Completadas</div>'
    +   '<div class="p">'+pc(tot.comp, tot.asig)+' de las asignadas</div></div>'
    + '<div class="est nore"><div class="n">'+tot.q.toLocaleString('es-CL')+'</div><div class="l">Quiebres</div>'
    +   '<div class="p">'+pc(tot.q, tot.asig)+' de las asignadas</div></div>'
    + '<div class="est"><div class="n" style="color:var(--mal-texto)">'+tot.resp.empresa+'</div>'
    +   '<div class="l">Quiebres de Dominion</div><div class="p">'+pc(tot.resp.empresa, tot.q)+' de los quiebres</div></div>'
    + '</div>';

  /* de quien son los quiebres de la semana */
  if(tot.q){
    const seg = k => tot.resp[k] ? '<span class="'+QB_RESP[k].css+'" style="width:'+(100*tot.resp[k]/tot.q)+'%">'
      + (100*tot.resp[k]/tot.q >= 8 ? pc(tot.resp[k], tot.q) : '')+'</span>' : '';
    const fila = (k, sub) => tot.resp[k] || k !== 'susp' ? '<div class="f"><span class="pt '+QB_RESP[k].css+'"></span>'
      + '<span class="tx">'+QB_RESP[k].l+'<small>'+sub+'</small></span>'
      + '<span class="vv">'+tot.resp[k]+'</span><span class="pp">'+pc(tot.resp[k], tot.q)+'</span></div>' : '';
    h += '<div class="caja"><h2>De quién son los quiebres <span class="chico">'+tot.q+' en la semana · '
      + tot.recup+' se completaron otro día</span></h2>'
      + '<div class="culpa">'+seg('cliente')+seg('mandante')+seg('empresa')+seg('susp')+'</div>'
      + '<div class="cul-lista">'
      + fila('cliente', 'sin moradores, reagenda, desiste, sin acceso, ductos tapados')
      + fila('mandante', 'red, datos mal ingresados y órdenes canceladas en su sistema')
      + fila('empresa', 'falta de dotación y códigos que no calzan en lo anterior: revisar')
      + fila('susp', 'quedaron suspendidas, VTR/CLARO no las cerró')
      + '</div></div>';
  }

  /* tabla por tecnico */
  h += '<div class="caja qb-caja"><h2>Por técnico <span class="chico">toca un técnico para ver sus quiebres uno por uno</span></h2>'
    + '<div class="fila-f"><span class="et">Ordenar por</span>'
    + '<button class="chip'+(ordenQb==='q'?' on':'')+'" data-oq="q">Cantidad de quiebres</button>'
    + '<button class="chip'+(ordenQb==='p'?' on':'')+'" data-oq="p">% de quiebre</button></div>';
  if(!tecs.length){
    h += '<div class="vacio">Sin órdenes de técnicos propios en esta selección.</div></div>';
  } else {
    h += '<table class="qb-tabla"><thead><tr><th>Técnico</th><th>Asignadas</th><th>Completadas</th>'
      + '<th>Quiebres</th><th>% quiebre</th><th class="iz">De quién</th><th>Cliente</th>'
      + '<th>VTR/CLARO</th><th>Dominion</th></tr></thead><tbody>';
    tecs.forEach((o, i) => {
      const mini = ['cliente','mandante','empresa','susp'].map(k => o.resp[k]
        ? '<span class="'+QB_RESP[k].css+'" style="width:'+(100*o.resp[k]/Math.max(o.q,1))+'%"></span>' : '').join('');
      const abierta = abiertoQb === o.tec;
      h += '<tr class="tec'+(abierta?' abierta':'')+'" data-tq="'+esc(o.tec)+'">'
        + '<td class="iz nom">'+esc(o.tec)+'<small>'+esc(o.sup)+'</small></td>'
        + '<td>'+o.asig+'</td><td>'+o.comp+'</td>'
        + '<td class="q">'+o.q+'</td>'
        + '<td class="pq'+(o.pq >= QB_ALTO ? ' alto' : '')+'"><b>'+nfQ(o.pq)+'%</b></td>'
        + '<td class="iz"><div class="qb-mini">'+mini+'</div></td>'
        + '<td class="cli'+(o.resp.cliente?'':' cero')+'">'+o.resp.cliente+'</td>'
        + '<td class="man'+(o.resp.mandante?'':' cero')+'">'+o.resp.mandante+'</td>'
        + '<td class="nos'+(o.resp.empresa?'':' cero')+'">'+o.resp.empresa+'</td></tr>';
      if(abierta) h += '<tr class="qb-det"><td colspan="9">'+detalleTecnico(o, semanas)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }

  h += '<div class="caja qb-nota"><b>Cómo se cuenta.</b> '
    + (QB_TIPOS.length ? 'Solo altas (incluye Alta Traslado) y migraciones; reparaciones y modificaciones no entran. ' : '')
    + 'Asignadas son todas las órdenes del técnico en la semana '
    + '(lunes a sábado), una por orden y día: la que se reagenda y vuelve otro día cuenta de nuevo ese día. '
    + 'Quiebre es toda orden que no terminó completada. Las de Falla Aprovisionamiento derivadas a GSA cuentan '
    + 'como completadas. Las canceladas van a VTR/CLARO porque se cancelan en su sistema. '
    + '"Otro día" son los quiebres cuya misma orden se completó en una fecha posterior. '
    + 'El export dice quién tenía la orden al cierre del día: si VTR/CLARO movió una orden a otro técnico, '
    + 'cuenta para el que la tenía al final.</div>';

  document.getElementById('vista').innerHTML = h;
  if(!SOLO_QB) document.getElementById('volver').addEventListener('click', portada);
  document.querySelectorAll('.chip[data-sq]').forEach(b => b.addEventListener('click', () => {
    semQb = b.dataset.sq; abiertoQb = null; pintarQuiebres(semanas); }));
  /* al cambiar de mes queda elegida su ultima semana */
  document.querySelectorAll('.chip[data-mq]').forEach(b => b.addEventListener('click', () => {
    mesQb = b.dataset.mq;
    semQb = semanas.filter(k => QB_MES_SEM[k] === mesQb).sort().pop();
    abiertoQb = null; pintarQuiebres(semanas); }));
  document.querySelectorAll('.chip[data-su]').forEach(b => b.addEventListener('click', () => {
    supQb = b.dataset.su || null; abiertoQb = null; pintarQuiebres(semanas); }));
  document.querySelectorAll('.chip[data-oq]').forEach(b => b.addEventListener('click', () => {
    ordenQb = b.dataset.oq; pintarQuiebres(semanas); }));
  document.querySelectorAll('.chip[data-tp]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); tipoDetQb = b.dataset.tp;
    const y = window.scrollY; pintarQuiebres(semanas); window.scrollTo(0, y); }));
  document.querySelectorAll('tr.tec').forEach(f => f.addEventListener('click', () => {
    abiertoQb = abiertoQb === f.dataset.tq ? null : f.dataset.tq;
    tipoDetQb = 'todo';
    const y = window.scrollY; pintarQuiebres(semanas); window.scrollTo(0, y); }));
  const bc = document.getElementById('qb-copiar');
  if(bc) bc.addEventListener('click', e => { e.stopPropagation(); copiarQuiebres(bc); });
}

/* Detalle que se abre bajo cada tecnico. */
/* (30-09-2026, Luis) Se saco la linea "Ultimas semanas" y en su lugar van
   los botones Todo / Altas / Migraciones de ESE tecnico: cambian solo su
   detalle (motivos, lista y resumen copiado), no la tabla. La tabla y las
   tarjetas cuentan siempre altas + migraciones. Al abrir otro tecnico
   vuelve a "Todo". */
function detalleTecnico(oTodo, semanas){
  let o = oTodo;
  if(tipoDetQb !== 'todo'){
    const antes = tipoQb; tipoQb = tipoDetQb;
    o = calcularQuiebres(semQb, supQb).find(t => t.tec === oTodo.tec)
        || {tec:oTodo.tec, sup:oTodo.sup, asig:0, comp:0, q:0, pq:0, recup:0,
            resp:{cliente:0, mandante:0, empresa:0, susp:0},
            mot:{cliente:{}, mandante:{}, empresa:{}, susp:{}}, filas:[]};
    tipoQb = antes;
  }
  let h = '<div class="fila-f qb-tipos">'
    + QB_BOTONES_TIPO.map(([k,l]) => '<button class="chip'+(tipoDetQb===k?' on':'')+'" data-tp="'+k+'">'+l+'</button>').join('')
    + '<span class="qb-cuenta">'+(o.asig
        ? o.asig+' asignadas · '+o.comp+' completadas · <b>'+o.q+' quiebres ('+nfQ(o.pq)+'%)</b>'
        : 'sin órdenes de este tipo en la semana')+'</span></div>';

  h += '<div class="qb-mot">';
  ['cliente','mandante','empresa','susp'].forEach(k => {
    if(!o.resp[k]) return;
    h += '<div class="g '+QB_RESP[k].cl+'"><div class="t">'+QB_RESP[k].l+': '+o.resp[k]+'</div>'
      + Object.entries(o.mot[k]).sort((a,b) => b[1]-a[1])
          .map(([m,v]) => '<div class="m"><span>'+esc(m)+'</span><span>'+v+'</span></div>').join('')
      + '</div>';
  });
  h += '</div>';

  h += '<div class="qb-acc"><button class="btn" id="qb-copiar">Copiar resumen para responder</button></div>';
  window._qbSel = o;

  const filas = o.filas.slice().sort((a,b) => ordenDia(a.r['Fecha']).localeCompare(ordenDia(b.r['Fecha'])));
  h += '<table class="tdet"><thead><tr><th>Fecha</th><th>OT</th><th>Actividad</th><th>Franja</th>'
    + '<th>Motivo</th><th>De quién</th><th>Otro día</th></tr></thead><tbody>';
  filas.forEach(f => {
    h += '<tr><td>'+esc(f.r['Fecha'].slice(0,5))+'</td>'
      + '<td class="ot">'+esc(f.r['Orden de Trabajo'] || '')+'</td>'
      + '<td>'+esc(categoria(f.r))+'</td>'
      + '<td>'+esc(f.r['Franja'] || '')+'</td>'
      + '<td>'+esc(f.m)+'</td>'
      + '<td>'+QB_RESP[f.k].c+'</td>'
      + '<td class="desp">'+(f.desp ? 'completada el '+f.desp : '')+'</td></tr>';
  });
  return h + '</tbody></table>';
}

/* Texto listo para pegar en un correo o WhatsApp cuando VTR/CLARO pregunta
   por un tecnico. */
function copiarQuiebres(boton){
  const o = window._qbSel; if(!o) return;
  if(!o.asig) return;
  const antes = tipoQb; tipoQb = tipoDetQb;          // el texto dice lo que se ve en el detalle
  const tipos = textoTiposQb(); tipoQb = antes;
  const lin = ['Técnico: '+o.tec+' (supervisor '+o.sup+')',
    'Semana '+numSemana(semQb)+', '+rangoSemana(semQb)+' ('+tipos+')',
    'Asignadas: '+o.asig+' · Completadas: '+o.comp+' ('+nfQ(100*o.comp/o.asig)+'%) · No ejecutadas: '+o.q];
  if(o.q){
    lin.push('', 'De las '+o.q+' no ejecutadas:');
    ['cliente','mandante','empresa','susp'].forEach(k => {
      if(!o.resp[k]) return;
      const det = Object.entries(o.mot[k]).sort((a,b) => b[1]-a[1]).map(([m,v]) => m+' '+v).join(', ');
      lin.push('- '+QB_RESP[k].c+': '+o.resp[k]+' ('+det+')');
    });
    if(o.recup) lin.push('', o.recup+' de ellas se completaron otro día.');
  }
  const txt = lin.join('\n');
  const listo = () => { boton.textContent = 'Copiado ✓'; setTimeout(() => boton.textContent = 'Copiar resumen para responder', 2000); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(listo, () => window.prompt('Copia este texto:', txt));
  } else { window.prompt('Copia este texto:', txt); }
}
